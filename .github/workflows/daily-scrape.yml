name: Daily VBank Tracker

on:
  schedule:
    # 香港時間早上 9:00 (UTC+8 → UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore promotions database
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/promotions.db
          key: promotions-db-${{ github.run_id }}
          restore-keys: |
            promotions-db-

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Run tracker pipeline
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:       ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:     ${{ secrets.RECIPIENT_EMAIL }}
        run: npx ts-node src/main.ts

      - name: Commit updated website data
        run: |
          git config user.name  "VBank Tracker Bot 🤖"
          git config user.email "bot@vbank-tracker.github.io"
          git add docs/data.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update data.json [$(date '+%Y-%m-%d %H:%M')]"
          git pull --rebase origin main --rebase --autostash
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
