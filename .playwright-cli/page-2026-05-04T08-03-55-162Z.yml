      - generic [ref=e281]:
        - text: 客戶推薦客戶活動（「MGM活動」） 由 2026 年 3 月 26 日開始至 2026 年 5 月 27 日結束（包括首尾兩日），被推薦人必須為 ZA Bank 的新客戶，未曾持有任何 ZA Bank 的產品（包括但不限於存款賬戶、貸款賬戶），以及成功使用推薦人的邀請碼在港開立 ZA Bank 賬戶。被推薦人在成功開戶後可獲得「被推薦人開戶獎賞」，被推薦人在完成入錢條件後可獲得「被推薦人入錢獎賞」, 被推薦人在完成達標條件後可獲得「被推薦人達標獎賞」。活動期共分為 9 個階段，於每個階段內，推薦開戶數目最多的前 20 名推薦人可獲得「推薦人排行榜獎賞」。推薦人在被推薦人完成入錢條件後可獲得「推薦人入錢獎賞」。推薦人在被推薦人完成達標條件後還可獲得「推薦人達標獎賞」。於活動期內累計推薦達指定數目，推薦人可額外獲「推薦人加碼獎賞」。上述奬賞將會在滿足條件後 30 個工作日內發放。活動受其
        - link "條款及細則" [ref=e282] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_HK/1002429
        - text: 約束。
        - text: 1. 被推薦人必須於活動期內填寫邀請碼並成功開立 ZA Bank 儲蓄賬戶，方會視為成功推薦，並按成功開戶日期計算到推薦人於對應階段的累計成功推薦。每位推薦人將根據當前的累計成功推薦開戶數目進行排名，同一數目的推薦人將按照其最後一位開戶的被推薦人填寫邀請碼的時間先後順序排列。每個推薦人的累計成功推薦將在每個階段第一天重置。
        - text: 2.「日終賬戶總結餘」包括以下 5 項的等值港元總和﹕（1）當日日終存款總金額（即活期存款、定期存款及錢罌之結餘）、（2）當日日終基金總金額、（3）當日下午 9 時之美股總資產、（4）當日日終港股總資產和（5）當日日終加密貨幣總資產。
        - text: 3.「StockBack x ZA Card」推廣活動：推廣期為 2025 年 11 月 3 日至 2026 年 6 月 30 日（包含首尾兩天）。參加者於推廣期內使用 ZA Card 支付的每筆合資格簽賬，而交易金額不少於 HKD 10 才能獲得一次 StockBack 機會，且不可同時獲得涉及 ZA Coin 獎賞的其他 ZA Card 推廣之獎賞。所有 StockBack 機會的有效時間為 48 小時。參加者於每一次 StockBack 機會中可從活動頁面上 「StockBack」機器展示的 6 隻股票中選擇其中一隻股票作為其股票回贈獎賞，該獎賞金額為有關交易簽賬金額的 1% 或根據 ZA Bank 不定期推出的限時推廣活動中獲得更高的回贈金額。參加者必須在選擇獎賞後的 90 個曆日內持有有效的投資賬戶及已開通對應投資交易服務後方有獎賞的擁有權及可接收獎賞，否則獎賞將失效及視為被放棄，ZA Bank 不會補發獎賞。「StockBack x ZA Card」推廣活動受
        - link "條款及細則" [ref=e283] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_CN/1002233
        - text: 約束。
        - text: 4.「StockBack x ZA Card」限時優惠推廣：推廣期為 2026 年 2 月 1 日至 2026 年 6 月 30 日（包含首尾兩日）。於推廣期內，參加者在每一次 StockBack 機會中，從「StockBack」機器中選擇的股票回贈獎賞之金額為該筆交易簽賬金額的 1.5%。「StockBack x ZA Card」限時優惠推廣受
        - link "條款及細則" [ref=e284] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_CN/1002354
        - text: 約束。
        - text: 5. 「StockBack x ZA Card」新人禮活動 ﹕推廣期為 2026 年 2 月 13 日至 2026 年 6 月 30 日（包含首尾兩日）。於推廣期內，未曾於 ZA Bank 開立銀行賬戶，以及未曾持有任何 ZA Bank 的產品或服務（包括但不限於存款賬戶、貸款賬戶）的新用戶在成功開戶後的 30 天內（開戶當日計算第一天），選擇「StockBack x ZA Card」回贈計劃並使用 ZA Card 所作的首 HKD 10,000 合資格簽賬交易，可享額外 1% 的股票回贈獎賞。此優惠可與 1.5% 股票回贈之優惠疊加使用，即新用戶最高可享 2.5% 的股票回贈獎賞。「StockBack x ZA Card」新人禮活動受受
        - link "條款及細則" [ref=e285] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_CN/1002355
        - text: 約束。
        - text: 6. 基金持倉回贈券包包括 HKD 780 和 HKD 20 基金持倉回贈券各 1 張，在收到後 30 天內有效，有關基金持倉回贈券之詳情請參閱活動
        - link "條款及細則" [ref=e286] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_HK/1002429
        - text: 。
        - text: 7. 股票現金回贈券包包括 1 張 HKD 300、2 張 HKD 200 和 3 張 HKD 100 股票現金回贈券，在收到後 30 天內有效，有關股票現金回贈券之詳情請參閱活動
        - link "條款及細則" [ref=e287] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_HK/1002429
        - text: 。
        - text: 8. HKD 126 貨幣兌換即減券在收到後 30 天內有效，有關貨幣兌換即減券之詳情請參閱活動
        - link "條款及細則" [ref=e288] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_HK/1002429
        - text: 。
        - text: 9. HKD 100 海外匯款現金回贈券在收到後 30 天內有效，有關海外匯款現金回贈券之詳情請參閱活動
        - link "條款及細則。" [ref=e289] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_HK/1002429
        - text: 10. 被推薦人需在完成指定條件後 7 天內前往 ZA Quest 領取 7 天港元新資金定存加息券。ZA Quest 受其
        - link "條款及細則" [ref=e290] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_HK/1001382
        - text: 。
        - text: 11. 被推薦人入錢獎賞：+19.9% p.a. 新資金定存加息券適用於 7 天港元定存，最高存入新資金金額為 HKD 20,000。被推薦人達標獎賞：+19.9% p.a. 新資金定存加息券適用於 7 天港元定存，最高存入新資金金額為 HKD 100,000。 新資金定存加息券在領取後 7 天內有效，更多使用條件以新資金定存加息券上顯示的內容為準。有關新資金定存加息券之詳情請參閱活動
        - link "條款及細則" [ref=e291] [cursor=pointer]:
          - /url: https://bank.za.group/agreement/html/zh_HK/1002429
        - text: 。
        - text: 眾安銀行有限公司 (「本行」) 獲授權於香港特別行政區從事銀行業務及受規管活動，並受香港法規所規管，為香港居民及訪港旅客提供的產品及服務，滿足使用者在港消費、理財等真實金融需求。 本行僅能在香港境內為持有效證件的人士提供開戶服務，在申請本行賬賬戶時，客戶必須要身處香港境內的主要城區內。 此資料僅可於香港境內分發或傳閱，在未經本行授權下，任何人不得在香港境外複製，分發或傳閱此資料。 本行無意讓任何人於任何本行受限制或未獲法律或法規授權從事銀行業務的司法管轄區、國家或地區內提供產品及服務。如你並非身處香港，本行或未獲授權於你身處或居住的國家或地區經本行的應用程式或網站向你供產品及服務。
        - text: 重要風險聲明
        - text: 外匯買賣涉及風險。將港元或外幣兌換為其他貨幣（包括港元）時，外匯之升跌波幅或會令客戶賺取利潤或招致虧損。人民幣匯率，如同其他貨幣一樣，有機會受廣泛因素影響而導致波動。客户於兌換人民幣至其他貨幣（包括港元）時，將可能受匯率波動而帶來利潤或損失。
        - text: 人民幣現時並非自由兌換的貨幣；同時透過香港銀行兌換人民幣必須受制於有關政策、監管要求及限制，將不時更改而毋須另行通知。實際的兌換安排須依據當時的限制及監管要求而定。
        - text: 投資涉及風險。投資產品價格可升可跌，甚至變成毫無價值。過往表現並非日後表現的指標。投資未必一定能夠賺取利潤，亦可能會招致損失。此平台的資料只供參考，並不構成及不應被視為任何建議、推銷、游說客戶認購或出售任何投資產品。投資者應根據本身投資經驗、投資目標、財務狀況及承擔風險程度等因素去衡量是否適合投資於該產品上。若有需要，請諮詢獨立專業建議。投資者作出任何投資決定前，應詳細閱讀有關之章則及條件，投資產品認購章程及其風險披露聲明。本平台之內容並未經證監會或任何香港的監管機構審閱。 ZA Bank 以代理人身份辦理你的指示。投資產品由第三方提供。若因銷售過程或處理有關交易產生合資格爭議 （定義見金融糾紛調解計劃的金融糾紛調解中心的職權範圍），ZA Bank 會與你進行金融糾紛調解計劃程序；然而，對於有關產品的合約條款的任何爭議，應由第三方產品發行人與你直接解決。ZA Bank 無意讓任何人於任何受限制或未獲法律或法規授權分發或使用此平台的司法管轄區、國家或地區內，分發或使用此平台。如你並非身處香港，我們或未獲授權於你身處或居住的國家或地區向你提供產品及服務。
