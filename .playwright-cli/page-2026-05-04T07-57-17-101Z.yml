      - generic [ref=e255]:
        - generic [ref=e257]:
          - text: 1. 開立投資賬戶所需的時間取決於實際情況而定。一般而言，在無需提交額外資料的情況下，現有 ZA Bank 用戶最快可於 1 分鐘內開通投資賬戶並完成認購基金。
          - text: 2.如需要了解更多投資服務的條款及細則，請按
          - link "「投資服務條款及細則」" [ref=e258] [cursor=pointer]:
            - /url: https://bank-invest.za.group/agreement/pdf/zh_HK/1000302
          - text: 。
          - text: "*由即日起至 2026 年7 月 31 日（包括首尾兩日），已開通 ZA Bank 基金交易服務的零售銀行用戶認購基金可享 0% 基金認購費優惠，以及所有基金的贖回費豁免。優惠受其"
          - link "「條款及細則」" [ref=e259] [cursor=pointer]:
            - /url: https://bank-invest.za.group/agreement/html/zh_HK/1001923
          - text: 約束。
        - generic [ref=e261]:
          - text: 基金的主要風險
          - text: ·投資者應閱讀基金的銷售文件，以了解風險因素的進一步詳情。
          - text: ·股票風險：股票市場可能大幅波動，而股價可能急升急跌，並將直接影響基金的資產淨值，當股票市場極為反覆，基金的資產淨值可能大幅波動。
          - text: ·固定收益證券風險：固定收益證券的價值將會受到利率及貨幣匯率波動以及發行人信貸質素變化而轉變。投資於固定收益證券或須承受個别發行人不履行付款或其他責任的信貸風險。
          - text: ·新興市場風險：投資於新興和較落後市場或須承受重大風險，包括政治和經濟風險、法律及監管風險、市場及結算風險、執行及交易對手方風險及貨幣風險。
          - text: ·國家/行業風險：個別基金可顯著投資於單一國家或行業，因而承受較高的資金集中風險；其價格波動及流動性風險會高於奉行較多元化投資政策的基金。
          - text: ·滙率風險：如投資收益並非以港元計算，投資者需要承受滙率波動的風險。
