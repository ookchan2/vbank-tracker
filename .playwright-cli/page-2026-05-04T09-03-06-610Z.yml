        - heading "Learn More" [level=2] [ref=e148]
        - generic [ref=e151]:
          - generic [ref=e154]:
            - heading "How to join WeLab Bank Personal Loan “R-Friend Referral” Campaign?" [level=5] [ref=e156] [cursor=pointer]
            - generic [ref=e162]:
              - paragraph [ref=e163]: All WeLab Bank customers are eligible for the campaign by making referrals with their unique referral codes. If you aren’t our customer yet, simply open an account during the Campaign Period and you’ll have your own referral code and can join the campaign!
              - paragraph [ref=e164]: To start referring, simply log in to WeLab Bank app and click the "Referrals" icon.
          - generic [ref=e168]:
            - heading "Who is my Referee?" [level=5] [ref=e170] [cursor=pointer]
            - generic [ref=e176]:
              - paragraph [ref=e177]: Any WeLab Bank existing customer who successfully applies for WeLab Bank Personal Instalment Loan or WeLab Bank Debt Consolidation Loan (together, “WeLab Bank Personal Loan”) using your referral code and drawdown the loan within 7 days after approval is your Referee.
              - paragraph [ref=e178]: Or, any WeLab Bank new customer who successfully opens an account using your referral code, applies for WeLab Bank Personal Loan, and drawdown the loan within 7 days after approval is your Referee.
              - paragraph [ref=e179]: Please note that, joining this campaign will mean you and your Referee confirm that you are of friends / relatives relationship, and you have not charged your Referee any fee related to the loan applied.
          - generic [ref=e183]:
            - heading "What is the referral reward?" [level=5] [ref=e185] [cursor=pointer]
            - paragraph [ref=e192]: During the Campaign Period, you can enjoy HKD 800 Referral Reward* if you have successfully referred your Referee to apply for WeLab Bank Personal Loan using your unique referral code and drawdown the loan within 7 days after approval. The more friends you referred, the more rewards you get!
          - generic [ref=e196]:
            - heading "What is the maximum referral reward?" [level=5] [ref=e198] [cursor=pointer]
            - paragraph [ref=e205]: You can earn a maximum of HKD 8,000 reward (that is up to 10 successful referrals!) during the Campaign Period.
          - generic [ref=e209]:
            - heading "When will I receive the referral reward?" [level=5] [ref=e211] [cursor=pointer]
            - paragraph [ref=e218]: The referral reward will be credited into your HKD Core Account on or before 31 July 2026.
          - generic [ref=e222]:
            - heading "What if my friends didn’t drawdown the loan eventually?" [level=5] [ref=e224] [cursor=pointer]
            - paragraph [ref=e231]: You will no longer be able to get the rewards.
          - generic [ref=e235]:
            - heading "What if my friend forgot to enter my referral code?" [level=5] [ref=e237] [cursor=pointer]
            - generic [ref=e243]:
              - paragraph [ref=e244]: If your friend did not enter your referral code during the account opening process / loan application process, you will no longer be able to get the rewards.
              - paragraph [ref=e245]: 💥💥Remember to remind your friend to enter your referral code during the account opening process (if your friend is a WeLab Bank New Customer) / during the loan application process (if your friend is a WeLab Bank Existing Customer)!
          - generic [ref=e249]:
            - heading "Can I close my account right after receiving the referral reward?" [level=5] [ref=e251] [cursor=pointer]
            - paragraph [ref=e258]: If you request to close our account within one year upon receiving the referral reward, we have the right to deduct the equivalent credited amount from your account prior to the closing of account or collect the equivalent amount from you through any other means.
