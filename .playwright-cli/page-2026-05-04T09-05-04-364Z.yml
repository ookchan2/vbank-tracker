      - paragraph [ref=e184]:
        - text: ³
        - link "The Club Membership – Mox Card linkage terms and conditions" [ref=e185] [cursor=pointer]:
          - /url: https://mox.com/static/260423_The_Club_Membership_Mox_Linkage_Terms_and_Conditions.pdf
        - text: apply.
      - paragraph [ref=e186]:
        - text: ⁴Please refer to the
        - link "Rewards for Cards Schedule" [ref=e187] [cursor=pointer]:
          - /url: https://mox.com/legal-documents/general-terms-and-conditions/terms-and-conditions-for-rewards-for-cards-issued-by-mox/
        - text: "for further details. From 2 April 2026 to 30 June 2026, when you make an eligible Mox Credit Card transaction, if you (a) have completed an Eligible Payroll Transaction of HKD25,000 or more; and/or (b) you have Mox+ (\"Unlocking Criteria\"), then you may earn unlimited 2% CashBack or HKD4 = 1 Asia Mile on the amount of the eligible Mox Credit Card transaction based on your selected Spending Rewards Scheme. From 1 July 2026, if you have satisfied either one of the Unlocking Criteria at the time you make an eligible Mox Credit Card transaction, you will earn unlimited 2% CashBack or HKD5 = 1 Asia Mile on the amount of the eligible Mox Credit Card transaction based on your selected Spending Rewards Scheme. If you have not satisfied the Unlocking Criteria at the time you make an eligible Mox Credit Card transaction, you may still earn unlimited 1% CashBack or HKD10 = 1 Asia Mile on the amount of the eligible Mox Credit Card transaction. “Eligible Payroll Transaction” means a transaction where your employer pays your salary into your Mox Account via FPS, and the transaction is displayed as ‘Salary’ in the Mox app. For the avoidance of doubt, standing instructions or other local electronic transfers are not considered ‘Eligible Payroll Transactions’. Based on your selected Spending Rewards Scheme, you will be eligible to receive: (i) 2% CashBack; or (ii) HKD4 =1 Asia Mile (until 30 June 2026) or HKD5 =1 Asia Mile (from 1 July 2026) during the period beginning on and from the day you complete the Eligible Payroll Transaction and ending on the last day of the next calendar month."
