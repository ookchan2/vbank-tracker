    - generic [ref=e164]:
      - generic [ref=e165]: 常見問題
      - list [ref=e166]:
        - listitem [ref=e167]:
          - generic [ref=e169] [cursor=pointer]: 認購基金後，需要多久才會收到基金單位?
          - paragraph [ref=e171]: 一般而言，基金公司在收到認購指示後的1至3個工作日內會確認交易，在3至5個工作日內分配基金單位。相比之下，貨幣基金的結算速度通常較快。每筆交易的實際交易確認及結算日期將取決於基金公司而定。
        - listitem [ref=e172]:
          - generic [ref=e174] [cursor=pointer]: 在螞蟻銀行認購/贖回基金有什麼收費?
          - paragraph [ref=e176]: 我們將按照個別基金認購章程列明的有關收費來徵收費用︰ · 認購費 – 最高為0.80% （貨幣基金的認購費可獲豁免） · 贖回費 – 豁免 · 平台費 – 豁免 · 管理費及其他費用將直接由基金公司收取 *不同基金的認購費和贖回費可能有所差異，具體取決於各個基金公司的規定。如需了解更多關於費用的詳細信息，請查閱相關的基金銷售文件及產品資料概要。
        - listitem [ref=e177]:
          - generic [ref=e179] [cursor=pointer]: 訪港旅客可否開立投資賬戶?
          - paragraph [ref=e181]: 可以，但前提是已經提交螞蟻銀行的銀行賬戶的開立申請或已有螞蟻銀行的賬戶，接著就可以提交投資賬戶的開立申請，但前提是提交投資賬戶申請時必須要身處香港境內。
        - listitem [ref=e182]:
          - generic [ref=e184] [cursor=pointer]: 什麼時候可以再次做風險評估？
          - paragraph [ref=e186]: 進行任何投資買賣前，投資者可透過螞蟻銀行應用程式或AlipayHK內的螞蟻銀行小程序的基金頁面完成風險評估問卷以獲取自己的風險接受程度作參考。個人風險承受能力亦會因應投資目標、財務狀況、年齡、投資經驗等因素而轉變，所以投資者應定期更新有關風險接受程度的紀錄。投資者每年最多可進行一共5次風險評估。如投資者認購基金，投資者需每年最少完成1次風險評估。
        - listitem [ref=e187]:
          - generic [ref=e189] [cursor=pointer]: 基金是否有最低認購金額？
          - paragraph [ref=e191]: 基金最低認購金額為港幣$1。不同基金的最低認購金額可能存在差異，具體詳情及交易規範請查看各基金的詳細說明。
        - listitem [ref=e192]:
          - generic [ref=e194] [cursor=pointer]: 基金定投
          - generic [ref=e196]:
            - paragraph [ref=e197]: 如何開始定投基金? 於螞蟻銀行應用程序或AlipayHK螞蟻銀行小程序進入理財頻道，點擊【基金】，點擊【基金定投】，點擊【選基金】，您可在基金名單中按自身投資需要揀選適合你的基金產品及計劃。
            - paragraph [ref=e198]: 定投最低要投多少 ？ 最低定投金額為 $1，讓你隨時開始。
            - paragraph [ref=e199]: 定投計劃可以更改或暫停嗎？ 可於螞蟻銀行應用程序或AlipayHK螞蟻銀行小程序進入理財頻道，點擊【基金】，點擊【基金定投】，點擊【我的定投】，就您想更改或暫停的基金計劃進行修改指示。
