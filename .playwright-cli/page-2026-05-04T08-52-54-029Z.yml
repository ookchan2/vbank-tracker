    - paragraph [ref=e43]:
      - generic [ref=e44]: Donation Acknowledgement and Tax Deduction Arrangements
      - text: The Government sincerely thanks the public for their generous donation to the Support Fund for Wang Fuk Court in Tai Po and would like to issue letters of appreciation to donors to express its gratitude. If you wish to receive the letter, please register via the website -
      - link "https://eform.cefs.gov.hk/form/hab033/en/" [ref=e45] [cursor=pointer]:
        - /url: https://eform.cefs.gov.hk/form/hab033/en
      - text: The Government has also made special arrangement to facilitate tax deduction for donors who have made donations directly to the Support Fund for Wang Fuk Court in Tai Po.
      - text: Donations made to the Support Fund for Wang Fuk Court in Tai Po through bank transfer with an amount of HK$50,000 or below will be eligible for tax deductions without the requirement of official receipts. Donors are however required to retain the relevant donation records, such as bank transfer slips, deposit slips, automated teller machine (ATM) receipts, online transaction records, monthly bank statements etc., to demonstrate donation has been made directly from the donors’ bank account to the bank accounts of the Support Fund for Wang Fuk Court in Tai Po for review by the Inland Revenue Department when required.
      - text: For details, please visit
      - link "https://www.taipofire.gov.hk/eng/taxdeduction.html" [ref=e46] [cursor=pointer]:
        - /url: https://www.taipofire.gov.hk/eng/taxdeduction.html
