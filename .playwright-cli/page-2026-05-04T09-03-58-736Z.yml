      - paragraph [ref=e162]:
        - strong [ref=e163]: 借定唔借？還得到先好借！
      - paragraph [ref=e164]: 名額有限，先到先得，額滿即止。
      - paragraph [ref=e165]: 如您在的開戶日期前12個月內曾經以您的名義持有Mox戶口，則不符合獎賞資格。
      - paragraph [ref=e166]:
        - text: ¹受
        - link "「1500MOX」迎新推廣條款及細則" [ref=e167] [cursor=pointer]:
          - /url: https://mox.com/static/1500MOX_Promotion_TnCs.pdf
        - text: 約束。
      - paragraph [ref=e168]:
        - text: ²詳情請參閱
        - link "Mox Credit附表" [ref=e169] [cursor=pointer]:
          - /url: https://mox.com/zh/legal-documents/general-terms-and-conditions/schedule-3/
        - text: （也稱為一般條款及細則附表3）及
        - link "Mox Credit產品資料概要" [ref=e170] [cursor=pointer]:
          - /url: https://mox.com/zh/legal-documents/key-fact-statements/mox-card-with-credit/
        - text: 。
      - paragraph [ref=e171]: ³你須於使用邀請碼當天及其後15天的期間內，完成Mox戶口開戶程序；並於使用邀請碼當天及其後30天的期間內，完成Mox Credit申請過程及收到Mox Credit批核通知。
      - paragraph [ref=e172]: ⁴有關合資格交易，請參閱卡獎賞附表第2條。
      - paragraph [ref=e173]:
        - text: ⁵若您持有Mox＋資格，我們會豁免此消費獎賞轉換費用，否則我們會收取HKD50消費獎賞轉換費，詳情請參閱
        - link "Mox Credit產品資料概要" [ref=e174] [cursor=pointer]:
          - /url: https://mox.com/zh/legal-documents/key-fact-statements/mox-card-with-credit/
        - text: 及
        - link "Mox+優惠列表" [ref=e175] [cursor=pointer]:
          - /url: https://mox.com/static/260402_Mox_Plus_Benefits_Table.pdf
        - text: 。
      - paragraph [ref=e176]:
        - text: ⁶詳情請參閱
        - link "卡獎賞附表" [ref=e177] [cursor=pointer]:
          - /url: https://mox.com/zh/legal-documents/general-terms-and-conditions/terms-and-conditions-for-rewards-for-cards-issued-by-mox/
        - text: 。由2026年4月2日至2026年6月30日，當你進行有關Mox信用卡合資格交易時，您 (a) 已完成一項至少HKD25,000的合資格出糧交易，及/或 (b) 持有Mox＋（「解鎖條件」），您可於選擇的消費獎賞計劃中獲得無上限2% CashBack或HKD4=1「亞洲萬里通」里數。由2026年7月1日起，當你進行Mox信用卡合資格交易時已滿足任何一項該解鎖條件，您可於選擇的消費獎賞計劃中獲得無上限2% CashBack或HKD5=1「亞洲萬里通」里數。當你進行Mox信用卡合資格交易時未能滿足該解鎖條件 ，你仍可享無上限1% CashBack或HKD10=1「亞洲萬里通」里數。「合資格出糧交易」是指您的僱主透過轉數快將您的薪金存入您的Mox戶口，而該交易在Mox app中顯示為「人工」。為免生疑問，常行指示或其他本地電子轉賬不被視為「合資格出糧交易」。根據您所選的消費獎賞計劃，您可於完成合資格出糧交易當日起至下一個曆月的最後一日之期間獲得：(i) 2% CashBack；或 (ii) HKD4=1「亞洲萬里通」里數 (直至2026年6月30日)；或(iii) HKD5=1「亞洲萬里通」里數(由2026年7月1日開始)。
      - paragraph [ref=e178]: ⁷在個別情況下，Mox Credit戶口的申請者或須提交相關證明文件，而提交文件過程輕鬆簡單。批核的所需時間，取決於實際情況而定。
