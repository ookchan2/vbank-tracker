      - generic [ref=e194]:
        - generic [ref=e196]:
          - text: "* StockBack 是指 ZA Bank 用戶通過 StockBack x ZA Card 機器所獲得的股票回贈。除了以 StockBack x ZA Card 消費，用戶可經「6 周年」活動以更多方式獲得 StockBack。"
          - link "「StockBack x ZA Card」推廣活動" [ref=e197] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/html/zh_HK/1002233
          - text: 及
          - link "ZA Bank 6 周年獎賞活動" [ref=e198] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/html/zh_HK/1002445
          - text: 受其相關的條款及細則約束。
          - text: 1.「6 周年獎賞」推廣活動：推廣期為 2026 年 4 月 1 日至 2026 年 4 月 21 日（包含首尾兩天）。活動共分為 6 個部分：(1)「最高 HKD 60,000 StockBack 抽獎」；(2)「用戶年齡『六字尾』額外獎賞」；(3)「6% StockBack 回贈」；(4)「做任務獲 StockBack」；(5)「新用戶 StockBack 獎賞」；(6)「StockBack 排行榜獎賞」。第 1 至 5 部分的獎賞均以「StockBack x ZA Card」的股票回贈形式發放，參加者須於獲得獎賞後 48 小時內在 ZA Bank App 內完成選股，逾期將失效且不獲補發。參加者必須持有有效的 ZA Card 及投資賬戶方可接收獎賞。詳情請參閱「6 周年獎賞」推廣活動
          - link "條款及細則" [ref=e199] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/html/zh_HK/1002445
          - text: 。
          - text: 2. ZA Bank Limited「6 周年咖啡回贈優惠推廣」 - 6% 股票回贈﹕推廣期為 2026 年 4 月 1 日至 2026 年 4 月 21 日（包含首尾兩日）。於推廣期內，參加者以 ZA Card於本地咖啡商戶類別進行合資格簽賬（不包括透過 Alipay 及 WeChat Pay 所作之簽賬）滿HKD 10後，可獲股票回贈獎賞之金額為該筆交易簽賬金額的 6%（「6% 回贈」）。推廣受
          - link "條款及細則" [ref=e200] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/pdf/zh_HK/1002433
          - text: 約束。
          - text: 3. 於推廣期內，每位參加者可獲得的 6% 回贈及 12% 回贈（統稱「特定回贈」）上限金額總和為 HKD 50（「特定回贈上限」）。 如參加者同時符合兩個或以上有關股票回贈獎賞的活動條件，參加者獲得之回贈將以較高者為準。例如有關交易同時符合 6% 回贈和 12% 回贈的活動條件，參加者將可獲得 12% 回贈。
          - text: 4. ZA Bank Limited「6 周年咖啡回贈優惠推廣」 - 12% 股票回贈﹕推廣期為 2026 年 4 月 1 日至 2026 年 4 月 21 日（包含首尾兩日）。於推廣期內，參加者以 ZA Card於指定咖啡商戶進行合資格簽賬（不包括透過 Alipay 及 WeChat Pay 所作之簽賬）滿HKD 10後，可獲股票回贈獎賞之金額為該筆交易簽賬金額的 12%（「12% 回贈」）。推廣受
          - link "條款及細則" [ref=e201] [cursor=pointer]:
            - /url: " https://bank.za.group/agreement/pdf/zh_HK/1002433"
          - text: 約束。
          - text: 5. 指定咖啡商戶請參閱
          - link "此處" [ref=e202] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/pdf/zh_HK/1002179
          - text: 。
          - text: 6.「StockBack 排行榜獎賞」分 3 個階段進行（第 1 階段：2026 年 4 月 1–7 日；第 2 階段：4 月 8–14 日；第 3 階段：4 月 15–21 日）。參加者可透過以下方式獲取 StockBack 分數：(a) 完成指定 ZA Quest 任務並完成選股；(b) 以 ZA Card 通過「StockBack x ZA Card」回贈計劃消費並完成選股；(c) 透過「股票最勁抽」獲得「指定股票兌換券」。每階段累積分數最高的前 1,000 名可獲排行榜獎賞：第 1–60 名獲 StockBack x ZA Card 金屬卡；第 61–1,000 名獲優先體驗 StockBack x ZA Card 實體卡。每位參加者於整個推廣期內最多可獲一（1）次排行榜獎賞。詳情請參閱「6 周年獎賞」推廣活動
          - link "條款及細則" [ref=e203] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/html/zh_HK/1002445
          - text: 。
        - generic [ref=e205]:
          - text: 此推廣適用於使用 ZA Card 以儲蓄賬戶餘額或 ZA Credit 支付的用戶。借定唔借？還得到先好借！
          - text: 重要風險聲明：
          - text: 投資涉及風險。股票價格可升可跌，甚至變成毫無價值。過往表現並非日後表現的指標。投資未必一定能夠賺取利潤，亦可能會招致損失。此平台的資料只供參考，並不構成及不應被視為任何建議、推銷、游說客戶認購或出售任何投資產品。投資者應根據本身投資經驗、投資目標、財務狀況及承擔風險程度等因素去衡量是否適合投資於該產品上。若有需要，請諮詢獨立專業建議。投資者作出任何投資決定前，應詳細閱讀有關之條款及細則及其風險披露聲明。若因銷售過程或處理有關交易產生合資格爭議（定義見金融糾紛調解計劃的金融糾紛調解中心的職權範圍），ZA Bank 會與你進行金融糾紛調解計劃程序。ZA Bank 無意讓任何人於任何受限制或未獲法律或法規授權分發或使用此平台的司法管轄區、國家或地區內，分發或使用此平台。如你並非身處香港，我們或未獲授權於你身處或居住的國家或地區向你提供產品及服務。
          - text: 所有公司名稱、標誌和品牌均為其各自所有者的商標或註冊商標。使用這些名稱、標誌和品牌並不表示獲得其認可或存在任何關聯關係。標誌僅用於識別上市公司之信息展示目的。
