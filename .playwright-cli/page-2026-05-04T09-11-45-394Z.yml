          - paragraph [ref=e549]: (3) 每月之基金平台費為你每日平台費的每月總額，而每日平台費則根據你每日所有於自選基金服務中除貨幣市場基金外已結算基金之持倉價值（港元或以每日參考匯率計算的等值港元）乘以基金平台月費率再除以該月曆日數計算。有關基金資產類別，請參閱WeLab Bank app內的基金詳情頁面。
          - paragraph [ref=e550]: (4) 假設認購費率為2%，使用我們自選基金服務的客戶在上述兩個例子較傳統收取認購費之收費模式節省85%的交易費用。以上例子僅供說明之用。你在作出任何投資決定之前，須評估本身的財務狀況、投資目標及經驗、承受風險的意願及能力，並了解有關產品的性質及風險。
          - paragraph [ref=e551]: (5) 你可以透過 WeLab Bank app 上之智動投資顧問服務設定你的投資目標，包括相應之投資年期及一次性投資及每月投資金額，而我們的系統會按照你的投資目標及考慮你的相關個人情況提供投資組合建議。如你接受投資組合建議，我們將遵從你的指示進行初始投資，及按照你設定的每月投資金額每月自動投資於投資組合建議。我們會不時提供各種提示，包括但不限於就你的投資目標進度提供提示，惟該等提示並非投資建議。你可於 WeLab Bank app 上查看投資目標之進度，以及按需要調整投資目標。本服務並非全權委託形式的資產管理服務，而本服務所提供之任何建議並不能作為你實現投資目標的保證。
          - paragraph [ref=e552]: (6) 此為遞交申請及啟動投資帳戶的估計時間，實際時間可能因應不同因素而有差異。
