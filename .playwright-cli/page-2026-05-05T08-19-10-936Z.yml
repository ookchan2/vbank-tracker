      - generic [ref=e365]:
        - paragraph [ref=e368]:
          - text: "# 由即日至 2026 年 5 月 31 日，用戶經 ZA Bank 網頁申請分期貸款或結餘轉戶計劃，並通過初步審批，即可參與「下載 ZA Bank App 查看初審結果獎賞活動」。合資格用戶需下載 ZA Bank App 並繼續申請貸款，並完成手機短信密碼驗證步驟，方可獲得一張商戶優惠券，優惠券的適用商戶及獎賞均以 ZA Bank 網頁的初步審批結果頁顯示爲準。 如申請結果為拒絕，則不可參與本活動。同一用戶只可參加本活動一次。受"
          - link "條款及細則" [ref=e370] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/html/zh_HK/1000124
          - text: 約束。
        - paragraph [ref=e373]:
          - text: 1. 由即日至 2026 年 5 月 31 日，在分期貸款申請過程中輸入優惠碼可領取 4 張貸款現金券，適用於不同貸款額。憑券成功提取指定貸款額及還款期，完成 7 天冷靜期後可獲得以下現金獎賞：
          - text: 1. HKD 150,000 – HKD 299,999、24 期或以上：HKD 1,000；
          - text: 2. HKD 300,000 – HKD 499,999、36 期或以上：HKD 2,500；
          - text: 3. HKD 500,000 – HKD 999,999、48 期或以上：HKD 5,000；或
          - text: 4. HKD 1,000,000、48 期或以上：HKD 10,000。
          - text: 現金券在貸款流程中輸入優惠碼起 14 天内有效。受
          - link "條款及細則" [ref=e375] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/html/zh_HK/1000124
          - text: 約束。
        - paragraph [ref=e378]: 2. 實際年利率 1.30% 是根據貸款額 HKD 1,000,000，還款期 12 個月及月平息為 0.0584% 為例計算。其他還款期的適用月平息、實際年利率，可參閲貸款申請中時顯示的利率及每月還款表。實際年利率是採用香港銀行公會所載的有關指引計算，並已被約至小數後兩個位。實際年利率是一個參考利率，以年化利率展示出包括銀行產品的基本利率及其他費用與收費（如適用）。
        - paragraph [ref=e381]: 3. 最終批核之貸款金額、利率及還款期視乎個別情況及本行的最終審批而異。
        - paragraph [ref=e384]: 4. 該審批結果為初步審核結果。用戶需提交相關文件而獲得最終審核結果。實際時間因人而異。一般來説，在資料準備充足的情況下，全新客戶最快可於 90 秒内在 ZA Bank 網站完成申請並獲得初步審核結果，而現有客戶於登入 ZA Bank App 後，於「貸款」頁發起申請到獲取初步審核結果最快可於 30 秒内完成。
