        - generic [ref=e206]:
          - text: 1.「股票最勁抽」推廣期為 2026 年 2 月 1 日至 2026 年 6月 30 日（包括首尾兩日）。參加者於推廣期內成功買入股票後，可獲得一次「股票最勁抽」機會，所有「股票最勁抽」機會由 ZA Bank 派發起 24 小時內有效，到期即失效。若參加者的美股買入交易之平台費收費為低於 USD 2 / 筆，或港股買入交易之平台費收費為低於 HKD 20 / 筆，參加者將不獲「股票最勁抽」機會。參加者的 ZA Bank App 的版本須在 3.8.9 以上，方能獲得「股票最勁抽」機會。於每一次「股票最勁抽」機會中，參加者只能獲得「指定股票兌換券」的獎賞，可兌換按美股市值排行前 100 的股票。「股票最勁抽」推廣受其
          - link "條款及細則" [ref=e207] [cursor=pointer]:
            - /url: https://bank-invest.za.group/agreement/html/zh_CN/1001728
          - text: 約束。
        - generic [ref=e209]: 2. 其他銀行的佣金是基於 11 家香港銀行美股佣金收費的平均數計算得出，最後更新日期為 2024 年 2 月 20 日。
        - generic [ref=e211]: 3. 免費實時報價只提供予已成功開通賬戶的「非專業訂閱者」，「專業訂閱者」僅展示 15 分鐘延遲報價。
        - generic [ref=e213]: 4. 對於已成功激活實體 ZA Card，並且不曾修改居住地址或個人資料的 ZA Bank 用戶，則無需上傳住址證明文件。另外，非證券及期貨條例下之註冊機構的僱員，則無需上傳僱主同意書。
        - generic [ref=e215]: 5. 數據截至 2023 年 12 月 31 日。
        - generic [ref=e217]: 6. 根據 Sia Partners 的 2023 年國際流動銀行基準（2023 International Mobile Banking Benchmark），ZA Bank 獲評為亞洲最佳流動銀行應用程式，並在全球最佳流動銀行應用程式中排名第六。該基準是對歐洲、中東和非洲地區、北美、亞洲和澳洲流動銀行現況的研究，以及前景展望。詳情請參閱：https://www.sia-partners.com/en/insights/publications/sia-partners-2023-international-mobile-banking-benchmark
        - generic [ref=e219]: 7. 數據截至 2023 年 12 月 31 日。
        - generic [ref=e221]: 重要風險聲明
        - generic [ref=e223]: 投資涉及風險。股票價格可升可跌，甚至變成毫無價值。過往表現並非日後表現的指標。投資未必一定能夠賺取利潤，亦可能會招致損失。此平台的資料只供參考，並不構成及不應被視為任何建議、推銷、游說客戶認購或出售任何投資產品。投資者應根據本身投資經驗、投資目標、財務狀況及承擔風險程度等因素去衡量是否適合投資於該產品上。若有需要，請諮詢獨立專業建議。投資者作出任何投資決定前，應詳細閱讀有關之條款及細則及其風險披露聲明。若因銷售過程或處理有關交易產生合資格爭議 (定義見金融糾紛調解計劃的金融糾紛調解中心的職權範圍)，ZA Bank 會與你進行金融糾紛調解計劃程序。ZA Bank 無意讓任何人於任何受限制或未獲法律或法規授權分發或使用此平台的司法管轄區、國家或地區內，分發或使用此平台。如你並非身處香港，我們或未獲授權於你身處或居住的國家或地區向你提供產品及服務。
