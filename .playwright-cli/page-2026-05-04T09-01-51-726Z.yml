        - generic [ref=e171]:
          - paragraph [ref=e172]: "*此乃根據2022年8月18日進行的有關Tesla貸款優惠之網上申請流程及優惠內容的市場調查。"
          - paragraph [ref=e173]: ^我們有權要求客戶提供額外文件以作批核，所需審批時間及現金到手時間因應客戶申請資料而有可能出現差異及視乎審批結果而定。任何貸款申請需根據正常貸款準則作評估。
          - paragraph [ref=e174]:
            - superscript [ref=e175]: "#"
            - text: 「活期」是指WeLab Bank核心賬戶及「存款」是指WeLab Bank核心賬戶的存款。
          - paragraph [ref=e176]: (1) 如客戶成功申請及獲批貸款金額HKD 300,000或以上，還款期為36個月，實際年利率為4.55%實際年利率乃根據銀行營運守則之指引計算，跟隨個別客戶而有差異並已被約至小數後兩個位。實際年利率是一個參考利率，以年化利率展示出已包括所有適用的利率、手續費及收費。客戶應以有關貸款確認信上所列明的資料為準。實際年利率只適用於指定貸款金額及還款期及僅供參考。最終獲批核之息率將視乎本行審批結果而有所調整。
          - paragraph [ref=e177]: (2) 在推廣期間，合資格客戶成功推薦薦友使用其專屬推薦碼成功申請WeLab Bank私人貸款，並於批核成功後的7日內提取貸款，即可獲得HKD 800 薦友獎賞（「薦友獎賞」）。每位合資格客戶在推廣期間最多可獲HKD8,000的現金獎賞（即最多10次成功推薦）。詳情請參閱條款及細則。
