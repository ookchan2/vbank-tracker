            - paragraph [ref=e80]
            - paragraph [ref=e81]: 5️⃣ The Current Wealth (HKD Equivalent) of Investment Account^ as of 23:59:59 of 31 May 2026 HKT must exceed the Current Wealth (HKD Equivalent) of Investment Account^ as of 00:00:00 of 9 April 2026 HKT by or more than HKD 100,000 (or equivalent).
            - paragraph [ref=e82]
            - paragraph [ref=e83]: ✅ If you complete the above 5 steps, you can enjoy respective cash reward*!
