            - paragraph [ref=e154]: All the cash rewards will be credited into your WeLab Bank Core Account on or before 30 June 2026.
          - generic [ref=e158]:
            - heading "What investment fees will be charged?" [level=5] [ref=e160] [cursor=pointer]
            - paragraph [ref=e167]: The fund platform fee shall be charged monthly and will be debited from your Core Account on or before the 7th business day of each month. The fund platform fee of a month is an aggregate amount of the daily fee within the month. Daily fee is calculated based on the daily market value of all your settled fund holdings in HKD (or HKD equivalent based on daily reference rate) under Featured Funds Services and Digital Wealth Advisory Services, excluding all money market fund holdings, multiplied by the fund platform fee monthly rate and divided by the number of calendar days of the month. Fund platform fee accrued in a month (if any) will be shown on the corresponding Investment Account Monthly Statement. For details of the prevailing fund platform fee monthly rate, please refer to the “General Services Charges”. For fund asset class information, please refer to the fund details page in WeLab Bank app. Also, fund houses may also charge management fee and other charges, where you may refer to relevant fund offering documents for more details and the Bank will receive a rebate of the management fee received by fund houses as the commission, please refer to General Service Charges for details.
