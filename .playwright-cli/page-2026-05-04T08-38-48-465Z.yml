          - heading "✨5 simple steps to participate in the Program starting from 9 Apr 2026:" [level=2] [ref=e69]
          - generic [ref=e71]:
            - paragraph [ref=e72]: 1️⃣ Successfully opened a valid Core Account with WeLab Bank on or before 31 March 2026;
            - paragraph [ref=e73]
            - paragraph [ref=e74]: 2️⃣ Between 9 April 2026 and 21 April 2026, maintain your Core Account and Investment Account with WeLab Bank;
            - paragraph [ref=e75]
            - paragraph [ref=e76]:
              - text: 3️⃣ Successfully subscribe to any fund by submitting one-time investment subscription instruction via the Featured Fund Services or GoWealth Digital Wealth Advisory with investment amount not less than equivalent of HKD 20,000 (WeLab Money Plus and Money Market Funds are also applicable); with an aggregate investment amount not less than HKD 100,000 (or its equivalent) at or before the respective cut-off time in HKT on 21 April 2026 as shown in the App
              - superscript [ref=e77]: +
              - text: ;
            - paragraph [ref=e78]
