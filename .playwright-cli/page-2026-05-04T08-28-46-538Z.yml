  - main [ref=e40]:
    - paragraph [ref=e43]:
      - generic [ref=e44]: 捐款致謝及稅務扣除安排
      - text: 政府衷心感謝各界對「大埔宏福苑援助基金」的慷慨支持，並希望向捐款人發出感謝信表達謝意。如欲收取感謝信，請到此網站登記：
      - link "https://eform.cefs.gov.hk/form/hab033/tc/" [ref=e45] [cursor=pointer]:
        - /url: https://eform.cefs.gov.hk/form/hab033/tc/
      - text: 為方便市民處理稅務扣除，政府亦為捐款至「大埔宏福苑援助基金」的捐款人作出特別安排。
      - text: 凡五萬港元或以下的捐款，若以轉賬方式過戶至「大埔宏福苑援助基金」戶口，捐款人可不用申領捐款收據亦可作稅務扣除申請，惟捐款人必須保留有關捐款記錄，如銀行轉賬交易單據、存款單、自動櫃員機收據、網上交易記錄、銀行月結單等，證明捐款由捐款人賬戶直接存入「大埔宏福苑援助基金」賬戶，以便日後被稅務局抽查時可呈交查驗。
      - text: 詳情請瀏覽：
      - link "https://www.taipofire.gov.hk/chi/taxdeduction.html" [ref=e46] [cursor=pointer]:
        - /url: https://www.taipofire.gov.hk/chi/taxdeduction.html
