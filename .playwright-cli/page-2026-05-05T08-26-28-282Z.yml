            - heading "點樣參與WeLab Bank私人貸款「R Friends大薦」？" [level=5] [ref=e152] [cursor=pointer]
            - generic [ref=e158]:
              - paragraph [ref=e159]: 現有 WeLab Bank 客戶都擁有專屬推薦碼，並可以參加是次推廣！未係客戶嘅話，只需於推廣期內成為WeLab Bank嘅客戶即可參與，並擁有專屬推薦碼！
              - paragraph [ref=e160]: 要開始推薦，只需登入WeLab Bank app，撳「推薦獎賞」圖示進入推薦計劃頁面。
          - generic [ref=e164]:
            - heading "邊個係我嘅薦友？" [level=5] [ref=e166] [cursor=pointer]
            - generic [ref=e172]:
              - paragraph [ref=e173]: WeLab Bank現有客戶用你嘅推薦碼成功申請WeLab Bank私人貸款（包括WeLab Bank私人分期貸款或WeLab Bank結餘轉戶貸款）並於批核成功後嘅7日內提取貸款嘅客戶就係你薦友。
              - paragraph [ref=e174]: 或者WeLab Bank新客戶開戶時用你嘅推薦碼成功開戶丶申請及於批核成功後7日內提取WeLab Bank私人貸款就係你薦友。
              - paragraph [ref=e175]: 請注意，參與是次推廣即代表你和你的薦友已同意雙方為朋友／親屬關係，而你並未有向薦友收取任何貸款相關的費用。
          - generic [ref=e179]:
            - heading "有咩薦友獎賞?" [level=5] [ref=e181] [cursor=pointer]
            - paragraph [ref=e188]: 喺推廣期間，你成功推薦薦友使用你嘅專屬推薦碼成功申請WeLab Bank私人貸款，並於批核成功後嘅7日內提取貸款，即可獲得HKD 800 薦友獎賞*！推薦越多朋友，獎賞越高！
          - generic [ref=e192]:
            - heading "最高薦友獎賞係幾多？" [level=5] [ref=e194] [cursor=pointer]
            - paragraph [ref=e201]: 你喺整個推廣期內可獲得嘅最高獎賞為HKD 8,000（即最多10個成功推薦！）。
          - generic [ref=e205]:
            - heading "我幾時會收到薦友獎賞?" [level=5] [ref=e207] [cursor=pointer]
            - paragraph [ref=e214]: 薦友獎賞將於2026年7月31日或之前存入你的港元核心賬戶。
          - generic [ref=e218]:
            - heading "如果我嘅朋友最後並無提取貸款，我仍有薦友獎賞嗎？" [level=5] [ref=e220] [cursor=pointer]
            - paragraph [ref=e227]: 你將不會收到任何獎賞。
          - generic [ref=e231]:
            - heading "如果我嘅朋友開戶時唔記得輸入我嘅推薦碼，可以點做？" [level=5] [ref=e233] [cursor=pointer]
            - generic [ref=e239]:
              - paragraph [ref=e240]: 如果你嘅朋友喺開戶過程／貸款申請過程中未有輸入你嘅推薦碼，你將不會收到任何獎賞。
              - paragraph [ref=e241]: 💥💥所以記住提你朋友喺開戶（如朋友為WeLab Bank新客戶）／貸款申請（如朋友為WeLab Bank現有客戶）輸入你嘅推薦碼喇！
          - generic [ref=e245]:
            - heading "我可以喺收到薦友獎賞後立即關閉戶口嗎？" [level=5] [ref=e247] [cursor=pointer]
            - paragraph [ref=e254]: 如果你喺收到薦友獎賞後一年內要求關閉你嘅戶口，我們保留權利喺關閉你嘅戶口前扣除有關獎賞金額、或以其他途徑收取有關獎賞金額而不另行通知。
