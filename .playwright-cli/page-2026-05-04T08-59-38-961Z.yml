      - generic [ref=e338]:
        - paragraph [ref=e341]:
          - text: 1. 於 2026 年 6 月 30 日或之前，在信用卡賬單分期計劃申請過程中輸入指定優惠碼可領取 3 張貸款現金券，適用於不同貸款額。憑券成功提取還款期 18 個月或以上，以及貸款額 HKD 200,000 – HKD 399,999、HKD 400,000 – HKD 799,999 或 HKD 800,000 或以上的信用卡賬單分期計劃，完成 7 天冷靜期後可分別獲得 HKD 588、HKD 688 及 HKD 2,000 現金獎賞。現金券在貸款流程中輸入優惠碼起 14 天内有效。受
          - link "條款及細則" [ref=e343] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/html/zh_HK/1000223
          - text: 約束。
        - paragraph [ref=e346]: 2. 最終批核之貸款金額、利率及還款期視乎個別情況及本行的最終審批而異。
        - paragraph [ref=e349]: 3. 信用卡賬單分期計劃的提取日與每月還款日相同，例子：如於 2021 年 8 月 1 日成功提取，首個還款日將為 2021 年 9 月 1 日。用戶平均於 30 天後才開始還款。
        - paragraph [ref=e352]: 4. 該審批結果為初步審核結果。用戶需提交相關文件而獲得最終審核結果。實際時間因人而異。一般來説，在資料準備充足的情況下，全新客戶最快可於 90 秒内在 ZA Bank 網站完成申請並獲得初步審核結果，而現有客戶於登入 ZA Bank App 後，於「貸款」頁發起申請到獲取初步審核結果最快可於 30 秒内完成。最終批核之貸款利率及金額視乎個別情況及本行的最終審批而異。
