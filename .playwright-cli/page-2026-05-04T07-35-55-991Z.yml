            - generic [ref=e88]: 平安數字銀行（國際）有限公司 (“平安數字銀行”) 爲根據《證券及期貨條例》登記的註冊機構（中央編號：BVJ909）。
            - generic [ref=e89]:
              - generic [ref=e90]: 重要提示
              - generic [ref=e91]: 本網站所載資料僅供一般參考用途，並不構成亦不應被視為任何投資意見、推薦、要約、招攬、游說、承諾或保證，亦非以銷售任何投資產品或服務為目的。所有資料並未根據任何人士或機構的特定投資目標、投資經驗、財務狀況或風險承受能力而編製。
              - generic [ref=e92]: 基金產品並不等於定期存款。投資決定須由投資者自行作出。在作出任何投資決定前，投資者應自行進行充足的資料搜集及研究，並審慎考慮自身的投資目標、投資經驗、財務狀況、投資期、投資知識及風險承受能力。如有需要，投資者應諮詢獨立的專業顧問意見，包括但不限於財務、法律、稅務及會計顧問。
              - generic [ref=e93]: 以下風險披露聲明未必能披露所有涉及的風險，亦不會考慮平安數字銀行所概不知情的個別情況。本網站所載資料僅反映刊發時的市場情況，惟不保證其準確性、完整性或持續有效性。
            - generic [ref=e94]:
              - generic [ref=e95]: 投資基金的主要風險
              - generic [ref=e96]: 以下為一般基金可能涉及的主要風險，並非詳盡列表，投資者應參閱相關基金銷售文件，以進一步了解基金的風險：
              - generic [ref=e97]: 股票風險：股票市場可能大幅波動，股價急升或急跌，將直接影響基金的資產淨值。當股票市場極度波動時，基金的資產淨值可能大幅變動。
              - generic [ref=e98]: 固定收益證券風險：固定收益證券的價值可能受利率、匯率變動及發行人信貸質素影響，包括特定發行人未能履行付款責任的信貸風險。
              - generic [ref=e99]: 新興市場風險：投資於新興或較落後市場可能涉及重大風險，包括政治、經濟、法律及監管風險、市場及結算風險、交易對手方風險及貨幣風險。
              - generic [ref=e100]: 國家／行業集中風險：部分基金可能集中投資於單一國家或行業，因而承受較高集中風險，而對比採取較多元化投資政策的基金會承受較高的價格波動性及流動性風險。
              - generic [ref=e101]: 滙率風險：如基金投資或回報並非以港元計算，投資者將承受滙率波動的風險。
              - generic [ref=e102]: 衍生工具風險：基金可能投資衍生工具，其價值可能劇烈波動，並涉及槓桿風險及交易對手風險。
            - generic [ref=e103]:
              - generic [ref=e104]: 風險披露聲明
              - generic [ref=e105]: 投資涉及風險。基金的價格可升可跌，市場波動可能顯著，投資者可能因投資而蒙受損失。在最壞情況下，投資者可能損失全部或大部分投資本金。任何投資的回報或表現均不受保證，過往表現亦不代表未來表現。
              - generic [ref=e106]: 基金表現數據以有關基金報價貨幣計算。所有表現數據均為對應時間週期內的累計回報，按每日更新。其中，各週期內基金的表現是根據該週期起始日和終止日對應的淨值變化來計算（若基金在該週期內存在派息，則派息金額也將統計在內）。
              - generic [ref=e107]: 基金的價格、波幅及流動性可能與你的預期不符，部分基金在特定市場情況下可能未能即時變現。投資者在作出任何投資決定前，應仔細閱讀相關基金的銷售文件、條款及細則、章程（如適用）及風險披露文件，以了解有關基金的詳細資料、性質及風險。
              - generic [ref=e108]: 本網頁所載資料只適用於香港居民，其内容不應視為於任何其他司法管轄區作出分銷、要約銷售或進行任何投資之誘因，有關活動在相關司法管轄區之適用法律法規下可能違反當地適用法律法規，特別是美國。若你繼續瀏覽本網站或進行任何投資活動，即表示及保證你是香港居民，或你本人所屬司法管轄區的適用法律法規容許你瀏覽有關資料及進行相關投資活動。
              - generic [ref=e109]: 本網站上有關於基金的資料，除非另外說明，由 Allfunds Hong Kong Limited (「資料供應商」) 向平安數字銀行所提供。 基於技術性理由，部份由資料供應商提供的基金資料或與各基金公司所提供的基金資料有所差異。資料供應商及平安數字銀行對資料供應商提供的資料的準確性、可靠性及完整性，以及資料的更新狀況概不作出任何保證及認可。平安數字銀行並無對該等資料進行獨立核證。平安數字銀行毋須就本網站所提供的資料的任何錯誤、遺漏或不確負責。平安數字銀行亦毋須就因使用或未能使用本網站的資料或與之相關的其他錯誤、干擾、運作上的延誤或未能完整傳送、線路上或系統上的故障而導致之損失或損害負責。本網站只供個人作非商業用途及僅供參考之用，該等資料並非旨在提供專業意見，而平安數字銀行提供該等資料並不旨在就基金提供意見。
              - generic [ref=e110]: 平安數字銀行是為基金公司分銷基金產品，而有關產品是基金公司而非平安數字銀行的產品。對於平安數字銀行與客戶之間因銷售過程或處理有關交易而產生的合資格爭議（定義見金融糾紛調解計劃的金融糾紛調解的中心職權範圍），平安數字銀行須與客戶進行金融糾紛調解計劃程序。然而，對於有關基金產品的合約條款的任何爭議，應由基金公司與客戶直接解決。
            - generic [ref=e111]: 本網站由平安數字銀行刊發，其內容並未經香港證券及期貨事務監察委員會或任何其他監管機構審閱。
