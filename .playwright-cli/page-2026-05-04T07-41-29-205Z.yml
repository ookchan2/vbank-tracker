        - generic [ref=e256]:
          - text: 1. 用戶需於成功開立 ZA Bank 賬戶後，經 ZA Quest 完成相關任務可獲得對應獎賞。優惠只適用於特選客戶，及不適用於經「客戶推薦客戶活動」開戶或已享「開戶新手禮活動」之用戶，有關任務詳情請於開戶後參閱 ZA Quest 頁面。ZA Quest 受
          - link "條款及細則" [ref=e257] [cursor=pointer]:
            - /url: javascript:window.HybirdNavigateTo("https://bank.za.group/agreement/html/zh_HK/1000258")
          - text: 約束。
          - text: 2. 優惠只適用於特選客戶，特選客戶於成功開立 ZA Bank 賬戶後，可於 ZA Quest 內領取股票現金回贈券。每筆交易只能使用一張股票現金回贈券。詳情請參閱卡券頁面顯示的內容。ZA Quest 受
          - link "條款及細則" [ref=e258] [cursor=pointer]:
            - /url: javascript:window.HybirdNavigateTo("https://bank.za.group/agreement/html/zh_HK/1000258")
          - text: 約束。
        - generic [ref=e260]:
          - text: 3. 對比 14 間傳統銀行及證券商經網上渠道交易港股所收取之最低佣金收費，平台費及存倉費之中位數，並以每個交易日均交易一筆，即一個月交易 20 筆為例所計算得出，數據更新日期為 2025 年 7 月 18 日。
          - text: 4. 加密貨幣交易服務只適用於以香港身份證開立 ZA Bank 賬戶及居住地址為香港之用戶。
          - text: 5. ZA Bank App 於 2025 年獲得德國 iF 設計獎。
          - text: 6. 根據 Sia Partners 的 2023 年國際流動銀行基準（2023 International Mobile Banking Benchmark），ZA Bank 獲評為亞洲最佳流動銀行應用程式，並在全球最佳流動銀行應用程式中排名第六。該基準是對歐洲、中東和非洲地區、北美、亞洲和澳洲流動銀行現況的研究，以及前景展望。詳情請參閱：https://www.sia-partners.com/en/insights/publications/sia-partners-2023-international-mobile-banking-benchmark
        - generic [ref=e262]:
          - text: 7. 數據截至 2023 年 12 月 31 日。
          - text: 8. 數據截至 2023 年 12 月 31 日。
        - generic [ref=e264]:
          - text: 重要風險聲明
          - text: 投資涉及風險。股票價格可升可跌，甚至變成毫無價值。過往表現並非日後表現的指標。投資未必一定能夠賺取利潤，亦可能會招致損失。此平台的資料只供參考，並不構成及不應被視為任何建議、推銷、游說客戶認購或出售任何投資產品。投資者應根據本身投資經驗、投資目標、財務狀況及承擔風險程度等因素去衡量是否適合投資於該產品上。若有需要，請諮詢獨立專業建議。投資者作出任何投資決定前，應詳細閱讀有關之條款及細則及其風險披露聲明。若因銷售過程或處理有關交易產生合資格爭議 （定義見金融糾紛調解計劃的金融糾紛調解中心的職權範圍），ZA Bank 會與你進行金融糾紛調解計劃程序。ZA Bank 無意讓任何人於任何受限制或未獲法律或法規授權分發或使用此平台的司法管轄區、國家或地區內，分發或使用此平台。如你並非身處香港，我們或未獲授權於你身處或居住的國家或地區向你提供產品及服務。
        - generic [ref=e266]:
          - text: 加密貨幣風險披露聲明
          - text: 投資涉及風險。虛擬資產是一種新的資產類別，以嶄新的技術開發，涉及與收購、存儲、轉讓和使用相關的不可預見的風險。虛擬資產的價格可能高度波動，投資者在決定投資虛擬資產時應格外謹慎。虛擬資產價格可升可跌，甚至變成毫無價值。過往表現並非日後表現的指標。投資未必一定能夠賺取利潤，亦可能會招致損失。此平台的資料只供參考，並不構成及不應被視為任何建議、推銷、游說客戶認購或出售任何投資產品。投資者應根據本身投資經驗、投資目標、財務狀況及承擔風險程度等因素去衡量是否適合投資於該產品上。若有需要，請諮詢獨立專業建議。投資者作出任何投資決定前，應詳細閱讀有關之條款及細則及其風險披露聲明。若因銷售過程或處理有關交易產生合資格爭議 （定義見金融糾紛調解計劃的金融糾紛調解中心的職權範圍），ZA Bank 會與你進行金融糾紛調解計劃程序。ZA Bank 無意讓任何人於任何受限制或未獲法律或法規授權分發或使用此平台的司法管轄區、國家或地區內，分發或使用此平台。如你並非身處香港，我們或未獲授權於你身處或居住的國家或地區向你提供產品及服務。
