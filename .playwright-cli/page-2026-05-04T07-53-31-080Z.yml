    - generic [ref=e238]:
      - generic [ref=e239]: 備註：
      - paragraph [ref=e240]:
        - text: 1.實際年利率乃根據《銀行營運守則》所載之指引計算，並已被約至小數後兩個位。實際年利率是一個參考利率，以年化利率展示出包括銀行產品的基本利率及其他費用與收費（如適用）。實際年利率由7.43%至35.05%，還款期由6個月至60個月。以下例子僅供說明用途。假設貸款額為港幣800,000及還款期為12個月，實際年利率為7.43%，貸款之總還款額為港幣831,497.86（豁免手續費）。詳情請參閱
        - link "《象象銀行私人分期貸款的條款及細則》" [ref=e241] [cursor=pointer]:
          - /url: https://api.platform.elebank.com/v2/webview/jump?url=202011977&jump_target=1022&l=zh-hk
        - text: 。此例子和計算結果不構成本行的報價或要約，亦對本行沒有約束力。獲批核的實際年利率由本行最終決定。 此推廣名額有限，額滿即止。如有任何爭議，本行將保留最終決定權。本行保留隨時更改「私人分期貸款」之詳情（包括條款及細則），或隨時暫停或終止「私人分期貸款」之酌情權，恕不另行通知。
      - paragraph [ref=e242]: 2.貸款額高達月薪12倍或港幣1,000,000（以較低者為準）。
      - paragraph [ref=e243]: 3.按個別情況，本行有權要求客戶提供額外文件以作批核，所需審批時間視乎實際情況而定。
      - paragraph [ref=e244]: 風險聲明：
      - paragraph [ref=e245]: 貨幣兌換風險 - 外幣兌換涉及匯率風險。客戶進行外幣兌換時可能會因當時外幣匯率之波動而出現虧損。 人民幣貨幣風險 - 人民幣現時並非自由兌換的貨幣，會不時受相關的監管要求限制。實際的兌換安排須依據當時的限制而定。
