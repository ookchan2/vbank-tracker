        - generic [ref=e405]: 13a. 該審批結果為初步審核結果。用戶需提交相關文件而獲得最終審核結果。實際時間因人而異。一般來説，在資料準備充足的情況下，全新用戶最快可於 90 秒内在 ZA Bank 網站完成申請並獲得初步審核結果，而現有用戶於登入 ZA Bank App 後，於「貸款」頁發起申請到獲取初步審核結果最快可於 30 秒内完成。
        - generic [ref=e407]: 13b. 最終批核之貸款金額、利率及還款期視乎個別情況及本行的最終審批而異。
        - generic [ref=e409]: 13c. 實際年利率 1.30% 是根據貸款額 HKD 1,000,000，還款期 12 個月及月平息為 0.0584% 為例計算。其他還款期的適用月平息、實際年利率，可參閲貸款申請中時顯示的利率及每月還款表。實際年利率是採用香港銀行公會所載的有關指引計算，並已被約至小數後兩個位。實際年利率是一個參考利率，以年化利率展示出包括銀行產品的基本利率及其他費用與收費（如適用）。
