        - img [ref=e358]
        - generic [ref=e360]:
          - img [ref=e361]
          - generic [ref=e362]:
            - paragraph [ref=e363]: ZA Bank 以「做壞規矩 做好銀行」為核心品牌精神，展示我們勇於發展「Banking for Web3」願景，致力為用戶做到最好的決心。
            - paragraph [ref=e364]: 做多一點就叫做壞規矩？ZA Bank 絕不認同。「規矩」可能是一些大家習以為常的事，但在 ZA Bank，沒有任何事情是理所當然。立身於科技發展的大趨勢，我們銳意藉數字銀行的技術優勢回應用戶所需，為用戶做壞「規矩」，從而帶來嶄新的銀行產品和服務體驗。
            - paragraph [ref=e365]: 哪怕今日作出的改變看似微不足道，未來亦能成為好的慣例，持續革新用戶對銀行「好」的定義，讓廣大用戶受惠。因此，我們敢於做多一點，以多款首創的產品和服務和前所未見的方便 App 介面「做好銀行」。
        - img [ref=e366]
      - generic [ref=e372]:
        - generic [ref=e374]: 1. 作為香港首間數字銀行，截至 2025 年 6 月 30 日，ZA Bank 的用戶存款及淨利潤均為香港 8 間數字銀行之中最高。資料來源︰8 間數字銀行中期業績報告。
        - generic [ref=e376]: 2. 開立戶口所需的時間取決於實際情況而定。一般而言，在無需提交額外資料的情況下，用戶最快可於 2 分鐘內完成戶口開立。
        - generic [ref=e378]: 3. ZA Bank 僅為香港境內的訪港旅客提供銀行服務，滿足用戶在港消費、理財等真實金融需求。
        - generic [ref=e380]: ^ 數據截至 2025 年 6 月 30 日。
        - generic [ref=e382]: 4. 截至 2025 年 12 月 15 日的 App Store 評分。
        - generic [ref=e384]: 5. 海外提款可能會被收取手續費。
        - generic [ref=e386]:
          - text: 6.「股票最勁抽」推廣期為 2026 年 2 月 1 日至 2026 年 6月 30 日（包括首尾兩日）。參加者於推廣期內成功買入股票後，可獲得一次「股票最勁抽」機會，所有「股票最勁抽」機會由 ZA Bank 派發起 24 小時內有效，到期即失效。若參加者的美股買入交易之平台費收費為低於 USD 2 / 筆，或港股買入交易之平台費收費為低於 HKD 20 / 筆，參加者將不獲「股票最勁抽」機會。參加者的 ZA Bank App 的版本須在 3.8.9 以上，方能獲得「股票最勁抽」機會。於每一次「股票最勁抽」機會中，參加者只能獲得「指定股票兌換券」的獎賞，可兌換按美股市值排行前 100 的股票。「股票最勁抽」推廣受其
          - link "條款及細則" [ref=e387] [cursor=pointer]:
            - /url: https://bank-invest.za.group/agreement/html/zh_HK/1001728
          - text: 約束。
        - generic [ref=e389]:
          - text: 7. 推廣期由 2026 年 2 月 1 日起至 2026 年 6 月 30 日（包括首尾兩日），首次成功開通 ZA Bank 加密貨幣交易服務的用戶，於開通後首 90 天進行加密貨幣交易可享無上限 $0 平台費優惠，受
          - link "條款及細則" [ref=e390] [cursor=pointer]:
            - /url: https://bank-invest.za.group/agreement/html/zh_HK/1002099
          - text: 約束。
        - generic [ref=e392]:
          - text: 8. 由即日起至 2026 年 7 月 31 日（包括首尾兩日），已開通 ZA Bank 基金交易服務的零售銀行用戶認購基金可享 0% 基金認購費優惠，以及所有基金的贖回費豁免。優惠受其
          - link "條款及細則" [ref=e393] [cursor=pointer]:
            - /url: https://bank-invest.za.group/agreement/html/zh_HK/1001923
          - text: 約束。
        - generic [ref=e395]:
          - text: 9.「StockBack x ZA Card」推廣活動：推廣期為 2025 年 11 月 3 日至 2026 年 6 月 30 日（包含首尾兩天）。參加者於推廣期內使用 ZA Card 支付的每筆合資格簽賬，而交易金額不少於 HKD 10 才能獲得一次 StockBack 機會，且不可同時獲得涉及 ZA Coin 獎賞的其他 ZA Card 推廣之獎賞。所有 StockBack 機會的有效時間為 48 小時。參加者於每一次 StockBack 機會中可從活動頁面上 「StockBack」機器展示的 6 隻股票中選擇其中一隻股票作為其股票回贈獎賞，該獎賞金額為有關交易簽賬金額的 1% 或根據 ZA Bank 不定期推出的限時推廣活動中獲得更高的回贈金額。參加者必須在選擇獎賞後的 90 個曆日內持有有效的投資賬戶及已開通對應投資交易服務後方有獎賞的擁有權及可接收獎賞，否則獎賞將失效及視為被放棄，ZA Bank 不會補發獎賞。「StockBack x ZA Card」推廣活動受
          - link "條款及細則" [ref=e396] [cursor=pointer]:
            - /url: https://bank.za.group/agreement/html/zh_HK/1002233
          - text: 約束。
        - generic [ref=e398]: 10. 消費之合資格簽賬交易金額需不少於 HKD 10 才能獲得「最勁抽」機會，且不可同時享有其他 ZA Card 回贈優惠。所有機會的有效時間為 48 小時。 每一次的「最勁抽」機會，將有機會給予高達簽賬額之 200% 回贈獎賞或其他指定獎賞。每個獎賞的中獎率並非平均分佈。回贈以 ZA Coin 形式發放。ZA Coin 是由眾安國際金融服務有限公司營運的第三方獎勵計劃。每筆交易的獎賞上限為 1,000,000 ZA Coin（或 HKD 10,000）。受條款及細則約束。
        - generic [ref=e400]: 11. 於活動推廣期內，用戶參與最勁抽或完成指定任務後有機會獲得百萬勁抽券，每輪活動所派發的百萬勁抽券數量上限為100萬張。ZA Bank 將於每輪活動結束後，透過電腦系統以隨機方式從 HKD 100 萬張百萬勁抽券中，抽出 100 張中獎百萬勁抽券。用戶每持有一張中獎券將會獲得 HKD 10,000 現金獎賞或其他等值之獎賞。百萬勁抽全新版活動 受條款及細則約束 。 * 此亦適用於 ZA Credit 用戶。借定唔借？還得到先好借！
        - generic [ref=e402]:
          - text: 12. 海外匯款的 SWIFT 電匯服務豁免 ZA Bank 手續費。其他可能涉及的費用，請參考
          - link "個人銀行收費服務" [ref=e403] [cursor=pointer]:
