          - text: 保險代理及保險公司之重要注意事項
          - text: 眾安人壽有限公司（業務名稱 ZA Insure）已獲香港特別行政區保險業監管局授權經營及監管。
          - text: 眾安銀行有限公司（“ZA Bank”）為 ZA Insure 之授權保險代理商（牌照號碼 GA1009）。
          - text: 以上保險產品均不是 ZA Bank 的產品、也不是銀行存款或銀行儲蓄計劃，及僅可在香港特別行政區內出售。部分保費用於支付保險和相關費用。投保人須承受 ZA Insure 的信貸風險。
          - text: 對於你與 ZA Bank 因由 ZA Bank 以保險公司代理人身分銷售的任何保險產品及有關交易而產生的合資格爭議（定義見金融糾紛調解計劃的金融糾紛調解中心職權範圍），ZA Bank 須與你進行金融糾紛調解計劃程序。而有關 ZA Insure 保險產品的合約條款若有任何爭議，ZA Bank 會盡力提供協助。
          - text: ZA Insure 的保險產品的申請以 ZA Insure 的核保及接納為準。作出決定之前，請仔細閱讀 ZA Insure 提供的產品資料，包括產品小冊子和保單條款，以確保你了解相關保險計劃的特點、風險、除外責任、限制以及完整的條款和條件。
          - text: ZA Insure 將因應潛在的保單持有人及／或受保人於網上申請期間所提供的資料保留接受或拒絕任何有關 ZA Insure 的指定保險產品之申請的權利。
