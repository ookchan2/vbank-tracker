        - generic [ref=e407]: 13c. The Annualised Percentage Rate (“APR”) of 1.30% is calculated based on an example where the loan amount is HKD 1,000,000, with a repayment tenor of 12 months and a monthly flat rate of 0.0584%. Please refer to the interest rate & monthly repayment table shown during the loan application for the applicable monthly flat rate and APR of other tenors. The APR is calculated using the method specified in relevant guidelines issued by the Hong Kong Associations of Banks and is rounded up or down to the nearest two decimal places. The APR is a reference rate, which includes the basic interest rates and other fees and charges (if applicable) of a product expressed as an annualised rate.
