        - generic [ref=e393]:
          - text: "9. \"StockBack x ZA Card\" Promotion: The promotion period is from 3 November 2025 to 30 June 2026, both dates inclusive. Each eligible transaction with the transaction amount of not less than HKD 10 by participants who use ZA Card to spend during the promotion period will be entitled to one (1) StockBack Chance, and will not be entitled to any rewards of other ZA Card promotions that involve ZA Coin. All StockBack Chances will be valid for 48 hours. For each StockBack Chance, participants can select one of the six (6) stocks on the StockBack machine on the campaign page as their stock rebate (“StockBack Rewards”), and the amount of reward will be 1% of the transaction amount or a higher rebate amount under limited-time promotions launched by ZA Bank from time to time. Participants must hold a valid investment account and have activated the corresponding investment trading services within 90 calendar days after selecting the StockBack Rewards in order to obtain ownership of and receive the rewards. Otherwise, the rewards will be forfeited and deemed as waived, and ZA Bank will not reissue the rewards. “StockBack x ZA Card”Promotion is subject to its"
