      - generic [ref=e196]:
        - heading "重要聲明" [level=2] [ref=e197]
        - generic [ref=e199]:
          - paragraph [ref=e200]: 貨幣兌換涉及風險。外匯市場面對著不可預測的波動。如果你將港元或外幣存款兌換成其他貨幣，該等外匯交易將面對由匯率波動帶來的風險。因此，你可能會蒙受損失。
          - paragraph [ref=e201]: 「動態貨幣兌換交易」（DCC）可在海外提款、商戶簽賬或網上簽賬時發生。如出現兌換匯率或提供選項將港元兌換成外幣或以港幣作結算可能涉及較高費用。WeLab Bank 概不負責商戶就該交易收取的任何費用及收費。
          - paragraph [ref=e202]: 本網站的螢幕顯示和圖像僅供參考，並不作任何形式的保證，並可隨時更改，恕不另行通知。以上內容並非亦不構成認購或進行任何交易的要約、建議、邀請或招攬。
          - paragraph [ref=e203]: 本網頁僅供參考，且不構成對任何人作出買賣、認購或交易任何投資產品或服務的要約、招攬、建議、意見或任何保證。投資產品或服務並不等同，亦不應被視為定期存款的代替品。
          - paragraph [ref=e204]: 投資涉及風險，基金價格可升可跌，甚至可能變成毫無價值。基於巿場情況，部分投資或不能即時變現。請細閱我們的理財服務條款(包括風險披露)，以及相關基金銷售文件，以瞭解我們的理財服務以及基金更多資料，包括其風險因素。
          - paragraph [ref=e205]: 投資決定是由你自行作出的，但你不應投資於本網頁所提及之產品或服務，除非中介人於銷售此產品時已向你解釋經考慮你的財政狀況、投資經驗及目標後，相關產品或服務是適合你的。
          - paragraph [ref=e206]: 你在作出任何投資決定之前，須評估本身的財務狀況、投資目標及經驗、承受風險的意願及能力，並了解有關產品的性質及風險。
          - paragraph [ref=e207]: 倘有任何關於本網頁所提及之產品或服務、進行交易或基金涉及性質及風險等方面的疑問，你應徵詢獨立財務顧問的意見。
          - paragraph [ref=e208]: 本網頁中的任何內容，均不應解釋為在任何司法管轄區進行分銷、出售要約或認購任何證券或投資產品的招攬，而根據此等司法管轄區的法律，該等行為屬於非法行為。
          - paragraph [ref=e209]: 如果你在香港境外，請了解並遵守任何相關限制。 繼續購買即表示你聲明並保證你是香港居民，或者你所在司法管轄區的適用法或法規允許你訪問本網站或我們的應用程式中的資訊並進行購買。
          - paragraph [ref=e210]: 本網頁由 WeLab Bank 刊發，內容並未經證券及期貨事務監察委員會審閱。
          - paragraph [ref=e211]: 本中文網頁為英文版本譯本， 如中、英文兩個版本有任何抵觸或不相符之處，應以英文版本為準。
