          - paragraph [ref=e228]: 重要聲明：外幣兌換涉及匯率風險。外幣的價值須承受因匯率波動而產生的風險。因此，當客戶將港幣或其他外幣兌換成另一種貨幣，及／或將外幣兌換成港元時，可能會出現利潤或蒙受虧損。
