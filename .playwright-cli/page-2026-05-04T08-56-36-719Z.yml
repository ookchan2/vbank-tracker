              - generic [ref=e110]: 本網站所載資料僅供一般參考用途，並不構成亦不應被視為任何投資意見、推薦、要約、招攬、游說、承諾或保證，亦非以銷售任何投資產品或服務為目的。所有資料並未根據任何人士或機構的特定投資目標、投資經驗、財務狀況或風險承受能力而編製。
              - generic [ref=e111]: 投資決定須由投資者自行作出。在作出任何投資決定前，投資者應自行進行充足的資料搜集及研究，並審慎考慮自身的投資目標、投資經驗、財務狀況、投資期、投資知識及風險承受能力。如有需要，投資者應諮詢獨立的專業顧問意見，包括但不限於財務、法律、稅務及會計顧問。
              - generic [ref=e112]: 以下風險披露聲明未必能披露所有涉及的風險，亦不會考慮平安數字銀行所概不知情的個別情況。本網站所載資料僅反映刊發時的市場情況，惟不保證其準確性、完整性或持續有效性。
            - generic [ref=e113]:
              - generic [ref=e114]: 風險披露聲明
              - generic [ref=e115]: 投資涉及風險，投資者可能因投資而蒙受損失。在最壞情況下，投資者可能損失全部或大部分投資本金。任何投資的回報或表現均不受保證，過往表現亦不代表未來表現。
              - generic [ref=e116]: 投資者在作出任何投資決定前，應仔細閱讀平安數字銀行的投資服務條款及細則和相關風險披露聲明，以了解相關投資的性質及風險。
              - generic [ref=e117]: 就海外投資（包括但不限於美國證券）而言，投資者在投資前應充分了解相關市場的監管制度、交易安排、系統維護、法律及稅務風險，並仔細考慮相關投資的詳情、風險和收費。投資者應就其特定稅務狀況向專業顧問尋求意見，包括但不限於可能涉及的遺產稅、預扣稅或其他稅務責任。某些投資服務可能不適用於特定人士或僅限於某些司法管轄區提供。投資者於作出投資前，應尋求獨立諮詢，考慮有關投資是否適合自己。
              - generic [ref=e118]: 本網頁所載資料只適用於香港居民，其内容不應視為於任何其他司法管轄區作出分銷、要約銷售或進行任何投資之誘因，有關活動在相關司法管轄區之適用法律法規下可能違反當地適用法律法規，特別是美國。若你繼續瀏覽本網站或進行任何投資活動，即表示及保證你是香港居民，或你本人所屬司法管轄區的適用法律法規容許你瀏覽有關資料及進行相關投資活動。
